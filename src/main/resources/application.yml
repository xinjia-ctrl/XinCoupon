spring:
  application:
    name: xin-coupon
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xin_coupon}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAME_SERVER:}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:xin-coupon-producer}

xincoupon:
  dispatch:
    rocketmq:
      topic: ${COUPON_EVENT_TOPIC:xin-coupon-event}
      received-tag: ${COUPON_RECEIVED_TAG:coupon-received}
      consumer-group: ${COUPON_EVENT_CONSUMER_GROUP:xin-coupon-event-consumer}

framework:
  cache:
    redis:
      unique-name: ${UNIQUE_NAME:${unique-name:xin-coupon}}
      prefix: ${CACHE_REDIS_PREFIX:}

server:
  port: 8080

logging:
  level:
    com.xinjia.coupon: info
