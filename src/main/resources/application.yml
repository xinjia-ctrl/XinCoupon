spring:
  application:
    name: xin-coupon
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xin_coupon}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}

xincoupon:
  auth:
    enabled: ${AUTH_ENABLED:false}
    user-id-header: ${AUTH_USER_ID_HEADER:X-User-Id}
    admin-token-header: ${AUTH_ADMIN_TOKEN_HEADER:X-Admin-Token}
    admin-token: ${AUTH_ADMIN_TOKEN:xin-coupon-admin}
  sharding:
    enabled: ${SHARDING_ENABLED:false}
    mode: ${SHARDING_MODE:MANUAL}
    user-coupon-table-count: ${USER_COUPON_TABLE_COUNT:2}
    coupon-batch-task-table-count: ${COUPON_BATCH_TASK_TABLE_COUNT:2}
  dispatch:
    rocketmq:
      topic: ${COUPON_EVENT_TOPIC:xin-coupon-event}
      received-tag: ${COUPON_RECEIVED_TAG:coupon-received}
      consumer-group: ${COUPON_EVENT_CONSUMER_GROUP:xin-coupon-event-consumer}
  search:
    sync-mode: ${SEARCH_SYNC_MODE:APPLICATION_EVENT}
    index-type: ${SEARCH_INDEX_TYPE:MEMORY}
    elasticsearch:
      url: ${ELASTICSEARCH_URL:http://localhost:9200}
      index-name: ${ELASTICSEARCH_COUPON_TEMPLATE_INDEX:coupon_template}
    canal:
      enabled: ${CANAL_ENABLED:false}
      host: ${CANAL_HOST:localhost}
      port: ${CANAL_PORT:11111}
      destination: ${CANAL_DESTINATION:example}
      username: ${CANAL_USERNAME:}
      password: ${CANAL_PASSWORD:}
      filter: ${CANAL_FILTER:xin_coupon.coupon_template}
      batch-size: ${CANAL_BATCH_SIZE:100}
      empty-sleep-millis: ${CANAL_EMPTY_SLEEP_MILLIS:1000}
  idempotent:
    store-type: ${IDEMPOTENT_STORE_TYPE:memory}
  lock:
    type: ${DISTRIBUTED_LOCK_TYPE:memory}
  mq:
    idempotent-store: ${MQ_IDEMPOTENT_STORE:mysql}
  receive:
    rocketmq:
      enabled: ${RECEIVE_ROCKETMQ_ENABLED:false}
      topic: ${RECEIVE_ROCKETMQ_TOPIC:xin-coupon-receive}
      tag: ${RECEIVE_ROCKETMQ_TAG:receive-requested}
      consumer-group: ${RECEIVE_ROCKETMQ_CONSUMER_GROUP:xin-coupon-receive-consumer}
  batch:
    staging:
      store-type: ${BATCH_STAGING_STORE:redis}

framework:
  cache:
    redis:
      unique-name: ${UNIQUE_NAME:${unique-name:xin-coupon}}
      prefix: ${CACHE_REDIS_PREFIX:}

knife4j:
  enable: ${KNIFE4J_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

server:
  port: 8080

logging:
  level:
    com.xinjia.coupon: info
